# Rebuilds the PLAYER STATISTICS panels from live GitHub data.
name: Sync Player HUD

on:
  schedule:
    - cron: '17 2 * * *'        # 07:47 IST daily. Odd minute = less queue contention.
  workflow_dispatch:            # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths: ['scripts/build-hud.mjs', '.github/workflows/hud.yml']

permissions:
  contents: write               # required: the job commits the regenerated SVGs

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build HUD
        run: node scripts/build-hud.mjs
        env:
          # GH_PAT is optional. Without it the built-in token is used, which
          # covers public data only. Add a PAT if you want private contributions.
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/hud-stats.svg assets/hud-langs.svg
          git diff --staged --quiet || git commit -m "chore: sync player HUD [skip ci]"
          git push
