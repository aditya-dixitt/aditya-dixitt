<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="900" height="300" role="img" aria-label="Aditya Dixitt — Player 01 — Developer, Builder, Problem Solver" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#00f0ff" stop-opacity="1"/>
      <stop offset="55%"  stop-color="#8a5cff" stop-opacity="1"/>
      <stop offset="88%"  stop-color="#ff2bd6" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ff2bd6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00f0ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.26" cy="0.48" r="0.72">
      <stop offset="0%"   stop-color="#0b2f42" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#05070d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#0f1c27" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feComponentTransfer result="d"><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode in="d"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="900" height="300" rx="14"/></clipPath>
  </defs>

  <style>
    .mono    { font-family: ui-monospace, "SF Mono", SFMono-Regular, "Cascadia Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .name    { font-size: 68px; font-weight: 700; letter-spacing: 2px;   fill: #eafcff; }
    .kicker  { font-size: 17px; font-weight: 500; letter-spacing: 5.5px; fill: #00f0ff; }
    .sub     { font-size: 19px; font-weight: 500; letter-spacing: 3.4px; fill: #ff2bd6; }
    .tag     { font-size: 16px; font-weight: 400; letter-spacing: 2.4px; fill: #55707f; }
    .lbl     { font-size: 15px; font-weight: 500; letter-spacing: 1.8px; fill: #6f8598; }
    .val     { font-size: 17px; font-weight: 700; letter-spacing: 1.4px; fill: #b9d7e6; }
    .cur     { fill: #00f0ff; animation: blink 1.1s steps(1) infinite; }
    .scan    { animation: drift 7s linear infinite; }
    .pulse   { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
    @keyframes drift { 0% { transform: translateY(-90px) } 100% { transform: translateY(320px) } }
    @keyframes pulse { 0%,100% { opacity: .3 } 50% { opacity: 1 } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="900" height="300" fill="#05070d"/>
    <rect width="900" height="300" fill="url(#grid)" opacity="0.5"/>
    <rect width="900" height="300" fill="url(#halo)"/>
    <rect class="scan" width="900" height="80" fill="url(#sweep)"/>

    <path d="M22 56V26h30"      fill="none" stroke="#00f0ff" stroke-width="2.5"/>
    <path d="M878 244v30h-30"   fill="none" stroke="#ff2bd6" stroke-width="2.5"/>
    <path d="M878 56V26h-30"    fill="none" stroke="#00f0ff" stroke-width="2.5" opacity="0.3"/>
    <path d="M22 244v30h30"     fill="none" stroke="#ff2bd6" stroke-width="2.5" opacity="0.3"/>

    <text class="mono kicker" x="52" y="74">SAVE FILE 01 <tspan fill="#2e4453">//</tspan> CHARACTER LOADED</text>

    <g filter="url(#glow)"><text class="mono name" x="50" y="152">ADITYA DIXITT</text></g>
    <rect class="cur" x="600" y="120" width="15" height="40"/>

    <text class="mono sub" x="52" y="190" filter="url(#soft)">BACKEND // SYSTEMS // FROM SCRATCH</text>
    <rect x="52" y="210" width="470" height="1.5" fill="url(#edge)"/>
    <text class="mono tag" x="52" y="242">IF IT ISN’T MEASURED, IT DIDN’T HAPPEN.</text>

    <g transform="translate(632,0)">
      <rect x="0" y="70" width="216" height="160" rx="8" fill="#080d15" stroke="#16303f" stroke-width="1.5"/>
      <text class="mono lbl" x="18" y="100">PLAYER</text>
      <text class="mono val" x="18" y="122">aditya-dixitt</text>
      <text class="mono lbl" x="18" y="152">ACCESS LEVEL</text>
      <text class="mono val" x="18" y="174" fill="#00f0ff">DEVELOPER</text>
      <text class="mono lbl" x="18" y="204">STATUS</text>
      <circle class="pulse" cx="24" cy="220" r="5" fill="#00ff9d"/>
      <text class="mono val" x="38" y="226" fill="#00ff9d">GRINDING</text>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="898.5" height="298.5" rx="14" fill="none" stroke="#16303f" stroke-width="1.5"/>
</svg>
